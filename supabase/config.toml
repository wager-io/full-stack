# Supabase local/dev config for the unified Wager app.
# Run `supabase start` to bring up the local stack, `supabase db reset` to apply
# migrations + seed, and `supabase functions serve` for Edge Functions.
project_id = "wager"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing inbox (verification / reset emails land here in dev).
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Google OAuth — fill secrets in `supabase/.env` (not committed). Disabled until set.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

# Multi-factor (TOTP) to replace the old speakeasy 2FA.
[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

# ---------------------------------------------------------------------------
# CCPayment posts here as CCPayment, not as a logged-in user, so it carries no
# Supabase JWT. Left at the default, the platform would reject every webhook
# with a 401 before the function ran, and CCPayment would retry a delivery that
# can never succeed.
#
# The endpoint is NOT unauthenticated as a result: it authenticates the caller
# itself, by HMAC over the raw body (see _shared/ccpayment.ts), which is the
# only check that actually proves CCPayment sent it. An anon-key JWT would
# prove nothing here — that key ships in the browser bundle.
# ---------------------------------------------------------------------------
[functions.ccpayment-webhook]
verify_jwt = false
